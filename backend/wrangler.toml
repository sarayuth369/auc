name = "auc-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# GEMINI_API_KEY is a secret, never a var:
#   wrangler secret put GEMINI_API_KEY
#
# GEMINI_MODEL is optional (legacy); defaults to gemini-3.6-flash if unset.
# AI_PROVIDER/AI_MODEL/AI_TIMEOUT_MS/AI_ENABLED drive the public /api/config
# response Flutter reads at runtime - change these to switch provider/model
# without rebuilding the app. None of this is secret; GEMINI_API_KEY stays a
# Worker secret only (wrangler secret put GEMINI_API_KEY).
#
# AI_PROVIDER=cloudflare routes through Workers AI (env.AI, bound below) -
# no API key needed. A prior live test of @cf/google/gemma-4-26b-a4b-it
# hallucinated on Thai input (domain-swapped, e.g. "3 rai 4 ngan" -> "3 hour
# to minute") in a way the dimension guard couldn't see because the swapped
# pair was internally self-consistent; local-unit-tokens.ts now rejects that
# generically. Currently testing @cf/zai-org/glm-4.7-flash on the real
# production path. Switch back to AI_PROVIDER=gemini/AI_MODEL=gemini-3.6-flash
# any time - GeminiProvider is unaffected either way.
[vars]
GEMINI_MODEL = "gemini-3.6-flash"
AI_ENABLED = "true"
AI_PROVIDER = "cloudflare"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_TIMEOUT_MS = "25000"

# Workers AI binding, created in the Cloudflare dashboard. Grants env.AI.run()
# - no API key, nothing secret; this line just wires the existing binding
# into source control.
[ai]
binding = "AI"

[observability]
enabled = true
