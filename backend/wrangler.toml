name = "auc-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# GEMINI_API_KEY is a secret, never a var:
#   wrangler secret put GEMINI_API_KEY
#
# GEMINI_MODEL is optional (legacy); defaults to gemini-3.6-flash if unset.
# AI_PROVIDER/AI_MODEL/AI_TIMEOUT_MS/AI_ENABLED drive the public /api/config
# response Flutter reads at runtime - change these to switch provider/model
# without rebuilding the app. None of this is secret; GEMINI_API_KEY stays a
# Worker secret only (wrangler secret put GEMINI_API_KEY).
[vars]
GEMINI_MODEL = "gemini-3.6-flash"
AI_ENABLED = "true"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.6-flash"
AI_TIMEOUT_MS = "25000"

[observability]
enabled = true
